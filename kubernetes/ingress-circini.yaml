---
# Dedicated HTTPS ingress for circini.callsphere.site
# cert-manager issues a Let's Encrypt cert into circini-tls.
# Routes mirror the apex ingress: /api -> backend, /ai -> ai-service, / -> frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: migration-agent-circini
  namespace: migration-agent
  labels:
    app: migration-agent
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - circini.callsphere.site
      secretName: circini-tls
  rules:
    - host: circini.callsphere.site
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 8084
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173

---
# HTTP -> HTTPS redirect on the web entrypoint (uses the shared cluster middleware).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: migration-agent-circini-redirect
  namespace: migration-agent
  labels:
    app: migration-agent
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: circini.callsphere.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173
