name: Agent evals

# LangSmith evaluation of the LangGraph agents against live GPT-OSS 120B on
# Bedrock. Datasets are synthetic (services/ai-service/evals/datasets); results
# are recorded as LangSmith experiments and gated by evals/thresholds.json.
on:
  schedule:
    - cron: "41 14 * * *"   # nightly, 02:41 NZST
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suites to run: all, or a comma list (router,guard,grant_judge,generation,impact,history,repository,consult)'
        required: false
        default: all
        type: string
      repetitions:
        description: 'Runs per example'
        required: false
        default: '1'
        type: string
  workflow_call:
    inputs:
      suite:
        required: false
        default: all
        type: string
      repetitions:
        # Two runs per case: single-run variance must not block a release.
        required: false
        default: '2'
        type: string
    secrets:
      LANGSMITH_API_KEY:
        required: false

permissions:
  contents: read
  # OIDC to the deploy role, only to read the Bedrock key from Secrets Manager.
  id-token: write

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    name: LangSmith agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/ai-service
    env:
      LLM_PROVIDER: bedrock
      BEDROCK_REGION: ${{ vars.BEDROCK_REGION || 'ap-southeast-2' }}
      PROCESSING_REGION: ${{ vars.BEDROCK_REGION || 'ap-southeast-2' }}
      APPROVED_LLM_HOST: bedrock-runtime.${{ vars.BEDROCK_REGION || 'ap-southeast-2' }}.amazonaws.com
      BEDROCK_MODEL: ${{ vars.BEDROCK_MODEL || 'openai.gpt-oss-120b-1:0' }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-service/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

      # The key is masked before it reaches the job environment and never
      # echoed; the eval process is the only consumer.
      - name: Load the Bedrock API key
        run: |
          set -euo pipefail
          KEY=$(aws secretsmanager get-secret-value --secret-id circini/bedrock-api-key \
            --query SecretString --output text)
          [ -n "$KEY" ] || { echo "::error::circini/bedrock-api-key is empty"; exit 1; }
          echo "::add-mask::$KEY"
          echo "AWS_BEARER_TOKEN_BEDROCK=$KEY" >> "$GITHUB_ENV"

      # Inputs reach the shell through the environment, never by interpolation
      # into the script, so a crafted value cannot inject commands.
      - name: Run agent evals
        env:
          EVAL_SUITE: ${{ inputs.suite || 'all' }}
          EVAL_REPETITIONS: ${{ inputs.repetitions || '1' }}
        run: >-
          python -m evals.run --gate
          --suite "$EVAL_SUITE"
          --repetitions "$EVAL_REPETITIONS"
          --report evals-report.json

      - name: Upload eval report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-evals-report
          path: services/ai-service/evals-report.json
          if-no-files-found: ignore
          retention-days: 30
