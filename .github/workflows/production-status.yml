name: Production release status

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
    steps:
      - name: Configure read access through deployment identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read automatic schedule logs after manual verification
        run: |
          python3 - <<'PYCODE'
          import datetime, json, subprocess
          def aws(*args):
              return json.loads(subprocess.check_output(['aws', *args, '--output', 'json'], text=True))
          start = int(datetime.datetime(2026, 9, 11, 1, 9, tzinfo=datetime.timezone.utc).timestamp() * 1000)
          logs = aws('logs', 'filter-log-events', '--log-group-name', '/aws/lambda/circini-business-hours', '--start-time', str(start))
          results, errors, invocations = [], [], []
          for event in logs.get('events', []):
              message = event.get('message', '').strip()
              timestamp = datetime.datetime.fromtimestamp(event['timestamp'] / 1000, datetime.timezone.utc).isoformat()
              if message.startswith('START RequestId:'):
                  invocations.append({'timestamp': timestamp, 'message': message})
              try:
                  value = json.loads(message)
              except json.JSONDecodeError:
                  value = None
              if isinstance(value, dict) and 'publicReady' in value:
                  results.append({'timestamp': timestamp, 'result': value})
              if '[ERROR]' in message or 'Traceback' in message or 'Task timed out' in message:
                  errors.append({'timestamp': timestamp, 'message': message[:700]})
          schedule = aws('scheduler', 'get-schedule', '--name', 'circini-business-hours')
          queue = aws('sqs', 'get-queue-url', '--queue-name', 'circini-business-hours-failures')['QueueUrl']
          attrs = aws('sqs', 'get-queue-attributes', '--queue-url', queue, '--attribute-names', 'ApproximateNumberOfMessages', 'ApproximateNumberOfMessagesNotVisible', 'ApproximateNumberOfMessagesDelayed')['Attributes']
          print(json.dumps({'automaticScheduleLogCheck': {'since': '2026-09-11T01:09:00Z', 'schedule': {key: schedule.get(key) for key in ['Name', 'State', 'ScheduleExpression', 'ScheduleExpressionTimezone']}, 'invocationCount': len(invocations), 'results': results[-8:], 'errors': errors, 'deadLetterQueue': attrs}}))
          assert len(results) >= 1, 'No automatic scheduled result found after 01:09 UTC'
          assert not errors, 'Scheduled controller errors found'
          assert schedule['State'] == 'ENABLED'
          assert all(int(count) == 0 for count in attrs.values()), 'Scheduler dead-letter queue contains messages'
          PYCODE
