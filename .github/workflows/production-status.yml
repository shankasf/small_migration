name: Production release status

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
    steps:
      - name: Configure read access through deployment identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read exact GitHub chat and connection metadata
        run: python3 scripts/run-github-chat-diagnostic.py
