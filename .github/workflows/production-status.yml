name: Production release status

on:
  workflow_dispatch:
    inputs:
      configure_signify_domain:
        description: Apply the reviewed Signify domain and certificate migration
        type: boolean
        default: false
      verify_release:
        description: Run production regression checks without rebuilding or restarting services
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  status:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      EXPECTED_LLM_MODEL: ${{ vars.LLM_PROVIDER == 'bedrock' && (vars.BEDROCK_MODEL || 'openai.gpt-oss-120b-1:0') || (vars.OPENAI_MODEL || 'gpt-6-astra') }}
      EXPECTED_LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN || 'migration-agent.uat.signify.net.nz' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure AWS deployment identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Hold scheduled shutdown during maintenance or verification
        if: ${{ inputs.configure_signify_domain || inputs.verify_release }}
        run: python3 scripts/manage-business-hours.py hold --owner "${{ github.run_id }}" --optional --wait
      - name: Configure Signify HTTPS domain
        if: ${{ inputs.configure_signify_domain }}
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/configure-app-domain.py
      - name: Save domain migration evidence
        if: ${{ always() && inputs.configure_signify_domain }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signify-domain-evidence
          path: domain-evidence/
          retention-days: 30
      - name: Wait for completed service rollouts
        if: ${{ inputs.verify_release }}
        run: python3 scripts/wait-production-stable.py

      - name: Inspect stack and service rollout status
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name circini-app \
            --query 'Stacks[].{Status:StackStatus,Updated:LastUpdatedTime}'
          aws cloudformation describe-stack-events --stack-name circini-app --max-items 25 \
            --query 'StackEvents[].{Time:Timestamp,Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}'
          aws ecs describe-services --cluster circini-demo --services backend frontend ai-service \
            --query 'services[].{Service:serviceName,Desired:desiredCount,Running:runningCount,Pending:pendingCount,Deployments:deployments[].{Status:status,State:rolloutState,Reason:rolloutStateReason,Task:taskDefinition,Running:runningCount,Pending:pendingCount,Failed:failedTasks},Events:events[:5]}'
          TASKS=$(aws ecs list-tasks --cluster circini-demo --desired-status RUNNING --query 'taskArns' --output text)
          if [ -n "$TASKS" ] && [ "$TASKS" != "None" ]; then
            aws ecs describe-tasks --cluster circini-demo --tasks $TASKS \
              --query 'tasks[].{Task:taskArn,Definition:taskDefinitionArn,Status:lastStatus,Health:healthStatus,Containers:containers[].{Name:name,Status:lastStatus,Health:healthStatus,Exit:exitCode,Reason:reason,Image:image}}'
          fi
      - name: Verify production APIs and agent workflows
        if: ${{ inputs.verify_release }}
        run: |
          bash deploy/smoke-test.sh "https://$APP_DOMAIN"
          python3 scripts/verify-github-production.py
          python3 scripts/verify-capabilities-production.py
          python3 scripts/verify-chat-search-production.py
          python3 scripts/verify-feedback-production.py
          python3 scripts/verify-impact-agent-production.py
          python3 scripts/verify-agent-graph-production.py
          python3 scripts/verify-memory-production.py

      - name: Release maintenance hold
        if: ${{ always() && (inputs.configure_signify_domain || inputs.verify_release) }}
        run: python3 scripts/manage-business-hours.py release --owner "${{ github.run_id }}" --optional
