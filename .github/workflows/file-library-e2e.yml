name: File library production E2E

on:
  workflow_dispatch:
    inputs:
      browser_public_key:
        description: 'Optional base64 PEM RSA public key; encrypts a 20-minute browser test credential'
        required: false
        type: string
      revoke_key_id:
        description: 'Revoke an exact E2E file library browser key ID instead of running tests'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: file-library-production-e2e
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure deployment identity
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify file library or revoke browser credential
        env:
          BROWSER_PUBLIC_KEY: ${{ inputs.browser_public_key }}
          FILE_LIBRARY_REVOKE_KEY_ID: ${{ inputs.revoke_key_id }}
        run: python3 scripts/verify-file-library-production.py
