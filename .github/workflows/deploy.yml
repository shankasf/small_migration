name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to redeploy (e.g. sha-abc1234). Leave blank to build from this commit.'
        required: false
        type: string

# id-token: write lets the job mint a GitHub OIDC token and assume the AWS
# deploy role — no long-lived AWS keys are stored in the repo.
permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  ECR_PREFIX: circini

jobs:
  # Nothing deploys unless the full CI suite passes first.
  ci:
    if: ${{ inputs.image_tag == '' }}
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push images
    if: ${{ inputs.image_tag == '' }}
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    strategy:
      matrix:
        service: [ai-service, backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: tag
        name: Derive immutable tag
        run: echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PREFIX }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ECR repositories are created with scan-on-push; this is a hard gate on
      # top of that — a CRITICAL, fixable finding fails the build.
      - name: Trivy scan ${{ matrix.service }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PREFIX }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    name: Deploy to AWS
    needs: build
    # always() so a workflow_dispatch rollback (which skips the build job)
    # still runs; the build result is then checked explicitly.
    if: >-
      ${{ always() && (
        inputs.image_tag != '' ||
        needs.build.result == 'success'
      ) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image tag
        id: resolve
        env:
          REQUESTED: ${{ inputs.image_tag }}
          BUILT: ${{ needs.build.outputs.image_tag }}
        run: |
          TAG="${REQUESTED:-$BUILT}"
          [ -n "$TAG" ] || { echo "::error::no image tag resolved"; exit 1; }
          echo "$TAG" | grep -qE '^sha-[0-9a-f]{7,40}$' \
            || { echo "::error::refusing tag '$TAG' — expected sha-<hex>"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Base stacks are idempotent — an unchanged template is a no-op. The app
      # stack carries the new image tag and config.
      - name: Deploy network / data / cognito stacks
        run: |
          set -euo pipefail
          # Keep the bootstrap role converged before it creates resources. The
          # role is deliberately allowed to update only circini-* IAM roles.
          aws cloudformation deploy --stack-name circini-github-oidc \
            --template-file deploy/aws/github-oidc.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          aws cloudformation deploy --stack-name circini-network \
            --template-file deploy/aws/network.yaml --no-fail-on-empty-changeset
          aws cloudformation deploy --stack-name circini-data \
            --template-file deploy/aws/data.yaml --no-fail-on-empty-changeset || {
              aws cloudformation describe-stack-events --stack-name circini-data \
                --max-items 30 \
                --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' \
                --output table
              exit 1
            }
          aws cloudformation deploy --stack-name circini-cognito \
            --template-file deploy/aws/cognito.yaml --no-fail-on-empty-changeset \
            --parameter-overrides AppUrl="https://${{ vars.APP_DOMAIN || 'migration.callsphere.site' }}"

      - name: Validate and configure GitHub App
        env:
          GITHUB_APP_BOOTSTRAP_JSON: ${{ secrets.GITHUB_APP_BOOTSTRAP_JSON }}
        run: node scripts/configure-github-app.mjs

      - name: Deploy app stack
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name circini-app \
            --template-file deploy/aws/app.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageTag="${{ steps.resolve.outputs.tag }}" \
              AuthMode="${{ vars.AUTH_MODE || 'oidc' }}" \
              CertificateArn="${{ vars.CERTIFICATE_ARN }}" \
              AppDomain="${{ vars.APP_DOMAIN || 'migration.callsphere.site' }}" \
              OpenAiModel="${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}"

      # Fargate has no init containers, so schema convergence runs as a one-off
      # task, then the backend is restarted to seed against the live schema.
      # Ordering is safe on a first-ever deploy: /api/health is DB-independent,
      # so the app stack's services reach steady state before the schema exists.
      - name: Run schema-sync task
        run: |
          set -euo pipefail
          SUBNETS=$(aws cloudformation list-exports \
            --query "Exports[?Name=='circini-AppSubnets'].Value" --output text)
          SG=$(aws cloudformation list-exports \
            --query "Exports[?Name=='circini-SgApp'].Value" --output text)
          TASK=$(aws ecs run-task --cluster circini-demo --launch-type FARGATE \
            --task-definition circini-schema-sync \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "schema-sync task: $TASK"
          aws ecs wait tasks-stopped --cluster circini-demo --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster circini-demo --tasks "$TASK" \
            --query "tasks[0].containers[?name=='schema-sync'].exitCode" --output text)
          echo "schema-sync exit code: $CODE"
          [ "$CODE" = "0" ] || { echo "::error::schema-sync failed"; exit 1; }

      - name: Roll services and wait for steady state
        run: |
          set -euo pipefail
          for s in backend ai-service frontend; do
            aws ecs update-service --cluster circini-demo --service "$s" \
              --force-new-deployment >/dev/null
          done
          aws ecs wait services-stable --cluster circini-demo \
            --services backend ai-service frontend

      - name: Smoke test
        run: |
          set -euo pipefail
          BASE="https://${{ vars.APP_DOMAIN || 'migration.callsphere.site' }}"
          curl -fsS -o /dev/null "$BASE/"
          curl -fsS "$BASE/api/health" | grep -q '"status":"ok"'
          echo "smoke test passed"
