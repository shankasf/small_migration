name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to redeploy (e.g. sha-abc1234). Leave blank to build from this commit.'
        required: false
        type: string

# id-token: write lets the job mint a GitHub OIDC token and assume the AWS
# deploy role — no long-lived AWS keys are stored in the repo.
permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  ECR_PREFIX: circini

jobs:
  # Nothing deploys unless the full CI suite passes first.
  ci:
    if: ${{ inputs.image_tag == '' }}
    uses: ./.github/workflows/ci.yml

  # The agents are regression-tested against the live model before any
  # release: LangSmith experiments gated by evals/thresholds.json.
  evals:
    if: ${{ inputs.image_tag == '' }}
    needs: ci
    uses: ./.github/workflows/agent-evals.yml
    secrets:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}

  build:
    name: Build and push images
    if: ${{ inputs.image_tag == '' }}
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    strategy:
      matrix:
        service: [ai-service, backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: tag
        name: Derive immutable tag
        run: echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prepare hosted Swagger documentation
        if: matrix.service == 'frontend'
        run: node services/frontend/scripts/prepare-api-docs.mjs

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PREFIX }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ECR repositories are created with scan-on-push; this is a hard gate on
      # top of that — a CRITICAL, fixable finding fails the build.
      - name: Trivy scan ${{ matrix.service }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PREFIX }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false

  deploy:
    name: Deploy to AWS
    needs: [build, evals]
    # always() so a workflow_dispatch rollback (which skips the build and eval
    # jobs) still runs; their results are then checked explicitly.
    if: >-
      ${{ always() && (
        inputs.image_tag != '' ||
        (needs.build.result == 'success' && needs.evals.result == 'success')
      ) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image tag
        id: resolve
        env:
          REQUESTED: ${{ inputs.image_tag }}
          BUILT: ${{ needs.build.outputs.image_tag }}
        run: |
          TAG="${REQUESTED:-$BUILT}"
          [ -n "$TAG" ] || { echo "::error::no image tag resolved"; exit 1; }
          echo "$TAG" | grep -qE '^sha-[0-9a-f]{7,40}$' \
            || { echo "::error::refusing tag '$TAG' — expected sha-<hex>"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Converge deployment permissions
        run: |
          aws cloudformation deploy --stack-name circini-github-oidc \
            --template-file deploy/aws/github-oidc.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Hold scheduled shutdown and wake the database for deployment
        run: python3 scripts/manage-business-hours.py hold --owner "${{ github.run_id }}" --optional --wait --pending-ok

      # Refresh short-lived credentials after a potentially slow RDS cold start.
      - name: Refresh AWS deployment credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Finish database startup with refreshed credentials
        run: python3 scripts/manage-business-hours.py hold --owner "${{ github.run_id }}" --optional --wait

      - name: Refresh credentials for the application rollout
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network / data / cognito stacks
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name circini-network \
            --template-file deploy/aws/network.yaml --no-fail-on-empty-changeset
          aws cloudformation deploy --stack-name circini-data \
            --template-file deploy/aws/data.yaml --no-fail-on-empty-changeset || {
              aws cloudformation describe-stack-events --stack-name circini-data \
                --max-items 30 \
                --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]' \
                --output table
              exit 1
            }
          aws cloudformation deploy --stack-name circini-cognito \
            --template-file deploy/aws/cognito.yaml --no-fail-on-empty-changeset \
            --parameter-overrides AppUrl="https://${{ vars.APP_DOMAIN || 'migration-agent.uat.signify.net.nz' }}" \
              AdditionalAppUrl="${{ vars.ADDITIONAL_APP_URL }}"

      - name: Validate and configure GitHub App
        env:
          GITHUB_APP_BOOTSTRAP_JSON: ${{ secrets.CIRCINI_GITHUB_APP_BOOTSTRAP_JSON }}
        run: node scripts/configure-github-app.mjs

      - name: Configure and preflight Bedrock GPT-OSS
        if: ${{ vars.LLM_PROVIDER == 'bedrock' }}
        env:
          BEDROCK_BOOTSTRAP_KEY: ${{ secrets.CIRCINI_BEDROCK_BOOTSTRAP_KEY }}
          BEDROCK_REGION: ${{ vars.BEDROCK_REGION || 'ap-southeast-2' }}
          BEDROCK_MODEL: ${{ vars.BEDROCK_MODEL || 'openai.gpt-oss-120b-1:0' }}
        run: |
          python3 -m pip install --user 'requests>=2.32.5,<3'
          python3 scripts/configure-bedrock.py

      # Agent traces are exported only with this key, and only redacted. A key
      # LangSmith rejects leaves trace export off rather than failing the release.
      - name: Converge the LangSmith trace-export key
        id: langsmith
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
        run: |
          set -euo pipefail
          echo "arn=" >> "$GITHUB_OUTPUT"
          if [ -z "$LANGSMITH_API_KEY" ]; then echo "No LangSmith key configured; trace export stays off"; exit 0; fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --proto '=https' --tlsv1.2 \
            -H "x-api-key: $LANGSMITH_API_KEY" "$LANGSMITH_ENDPOINT/api/v1/sessions?limit=1")
          if [ "$STATUS" != "200" ]; then echo "::warning::LangSmith rejected the key (HTTP $STATUS); trace export stays off"; exit 0; fi
          umask 077
          KEY_FILE="$RUNNER_TEMP/langsmith-key"
          printf '%s' "$LANGSMITH_API_KEY" > "$KEY_FILE"
          NAME=circini/langsmith-api-key
          if ARN=$(aws secretsmanager describe-secret --secret-id "$NAME" --query ARN --output text 2>/dev/null); then
            CURRENT=$(aws secretsmanager get-secret-value --secret-id "$NAME" --query SecretString --output text)
            [ "$CURRENT" = "$LANGSMITH_API_KEY" ] || \
              aws secretsmanager put-secret-value --secret-id "$NAME" --secret-string "file://$KEY_FILE" >/dev/null
          else
            ARN=$(aws secretsmanager create-secret --name "$NAME" --secret-string "file://$KEY_FILE" \
              --description 'LangSmith API key for redacted agent trace export' --query ARN --output text)
          fi
          rm -f "$KEY_FILE"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Apply additive security schema before replacing tasks
        run: python3 scripts/preflight-security-schema.py

      # A model the OpenAI account cannot use would break every chat turn, so
      # check it with the production key before any task is replaced.
      - name: Confirm the OpenAI account can use the configured model
        if: ${{ (vars.LLM_PROVIDER || 'openai') == 'openai' }}
        env:
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-astra' }}
        run: python3 scripts/preflight-openai-model.py

      - name: Deploy app stack
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name circini-app \
            --template-file deploy/aws/app.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageTag="${{ steps.resolve.outputs.tag }}" \
              AuthMode="${{ vars.AUTH_MODE || 'oidc' }}" \
              CertificateArn="${{ vars.CERTIFICATE_ARN }}" \
              AdditionalCertificateArn="${{ vars.ADDITIONAL_CERTIFICATE_ARN }}" \
              IntegrationAppDomain="${{ vars.INTEGRATION_APP_DOMAIN }}" \
              AppDomain="${{ vars.APP_DOMAIN || 'migration-agent.uat.signify.net.nz' }}" \
              OpenAiModel="${{ vars.OPENAI_MODEL || 'gpt-6-astra' }}" \
              LlmProvider="${{ vars.LLM_PROVIDER || 'openai' }}" \
              BedrockRegion="${{ vars.BEDROCK_REGION || 'ap-southeast-2' }}" \
              BedrockModel="${{ vars.BEDROCK_MODEL || 'openai.gpt-oss-120b-1:0' }}" \
              ApprovedLlmHost="${{ vars.APPROVED_LLM_HOST || 'api.openai.com' }}" \
              ProcessingRegion="${{ vars.PROCESSING_REGION || 'unverified' }}" \
              ProviderApprovalReference="${{ vars.PROVIDER_APPROVAL_REFERENCE }}" \
              AzureEndpoint="${{ vars.AZURE_OPENAI_ENDPOINT }}" \
              AzureDeployment="${{ vars.AZURE_OPENAI_DEPLOYMENT }}" \
              LangSmithSecretArn="${{ steps.langsmith.outputs.arn }}" \
              LangSmithEndpoint="${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}"

      # Fargate has no init containers, so schema convergence runs as a one-off
      # task, then the backend is restarted to seed against the live schema.
      # Ordering is safe on a first-ever deploy: /api/health is DB-independent,
      # so the app stack's services reach steady state before the schema exists.
      - name: Run schema-sync task
        run: |
          set -euo pipefail
          SUBNETS=$(aws cloudformation list-exports \
            --query "Exports[?Name=='circini-AppSubnets'].Value" --output text)
          SG=$(aws cloudformation list-exports \
            --query "Exports[?Name=='circini-SgApp'].Value" --output text)
          TASK=$(aws ecs run-task --cluster circini-demo --launch-type FARGATE \
            --task-definition circini-schema-sync \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "schema-sync task: $TASK"
          aws ecs wait tasks-stopped --cluster circini-demo --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster circini-demo --tasks "$TASK" \
            --query "tasks[0].containers[?name=='schema-sync'].exitCode" --output text)
          echo "schema-sync exit code: $CODE"
          [ "$CODE" = "0" ] || { echo "::error::schema-sync failed"; exit 1; }

      - name: Roll services and wait for steady state
        run: |
          set -euo pipefail
          for s in backend ai-service frontend; do
            aws ecs update-service --cluster circini-demo --service "$s" \
              --force-new-deployment >/dev/null
          done
          python3 scripts/wait-production-stable.py

      - name: Smoke test
        run: |
          set -euo pipefail
          BASE="https://${{ vars.APP_DOMAIN || 'migration-agent.uat.signify.net.nz' }}"
          curl -fsS -o /dev/null "$BASE/"
          curl -fsS "$BASE/api/health" | grep -q '"status":"ok"'
          echo "smoke test passed"

      - name: Verify live GitHub integration
        run: python3 scripts/verify-github-production.py

      - name: Verify public agent and tool APIs
        run: python3 scripts/verify-capabilities-production.py

      - name: Verify live chat history search
        run: python3 scripts/verify-chat-search-production.py

      - name: Verify response feedback rubric
        run: python3 scripts/verify-feedback-production.py

      - name: Verify head and impact analysis agents
        env:
          EXPECTED_LLM_MODEL: ${{ vars.LLM_PROVIDER == 'bedrock' && (vars.BEDROCK_MODEL || 'openai.gpt-oss-120b-1:0') || (vars.OPENAI_MODEL || 'gpt-6-astra') }}
          EXPECTED_LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
        run: python3 scripts/verify-impact-agent-production.py

      - name: Verify the LangGraph migration pipeline
        env:
          EXPECTED_LLM_MODEL: ${{ vars.LLM_PROVIDER == 'bedrock' && (vars.BEDROCK_MODEL || 'openai.gpt-oss-120b-1:0') || (vars.OPENAI_MODEL || 'gpt-6-astra') }}
          EXPECTED_LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
        run: python3 scripts/verify-agent-graph-production.py

      - name: Verify long-term memory and summarisation
        run: python3 scripts/verify-memory-production.py

      - name: Deploy Auckland business-hours schedule
        run: |
          python3 -m pip install --user PyYAML==6.0.2
          python3 scripts/deploy-business-hours.py
          python3 scripts/manage-business-hours.py reconcile

      - name: Resume business-hours policy after deployment
        if: ${{ always() }}
        run: python3 scripts/manage-business-hours.py release --owner "${{ github.run_id }}" --optional
