name: CI

on:
  schedule:
    - cron: "23 4 * * *"
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by deploy.yml so nothing ships without these checks passing.
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # github.workflow differs when this is called by deploy.yml, so the standalone
  # CI run and the deploy-invoked one land in separate groups. Sharing a group
  # made them cancel each other, which intermittently killed deploys.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: GitHub integration security tests
        run: npx tsx --test tests/github.test.ts tests/githubAgent.test.ts tests/impact.test.ts

  backend-security:
    name: Backend security integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: migration_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - run: npm ci
        working-directory: services/backend
      - run: npx prisma generate
        working-directory: services/backend
      - name: Exercise storage, isolation, revocation and retention boundaries
        run: scripts/test-security.sh
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-test-password@127.0.0.1:5432/migration_security_test

  frontend:
    name: Frontend — typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  ai-service:
    name: AI service — security and behaviour tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/ai-service/requirements.txt
            services/ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Security, guardrail and agent-graph tests
        run: python -m pytest tests/ -v

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }

      # Node dependencies are gated by Trivy reading package-lock.json rather
      # than by `npm audit`.
      #
      # npm falls back to the registry's legacy full-tree audit endpoint
      # whenever a dependency resolves outside the registry — services/backend
      # pins xlsx to the SheetJS CDN tarball, because the registry copy is
      # abandoned at 0.18.5 with an unfixed advisory. npm has now retired that
      # endpoint ("This endpoint is being retired. Use the bulk advisory
      # endpoint instead"), and it answers 400, so `npm audit` cannot gate this
      # repo at all. Trivy resolves the same lockfile against its own database,
      # so the gate no longer depends on a registry endpoint — and it is the
      # scanner already gating our images in deploy.yml.
      #
      # Both services scan clean, so the gate stays at HIGH rather than
      # critical. If this starts failing, fix the dependency — do not lower
      # the threshold back.
      - name: Trivy — backend dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: services/backend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Trivy — frontend dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: services/frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: pip-audit — ai-service
        run: |
          pip install pip-audit
          pip-audit -r services/ai-service/requirements.txt

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep scan
        # Curated rulesets covering language security rules, OWASP Top Ten and
        # infrastructure files. --error fails the job on any finding.
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --config=p/python \
            --config=p/dockerfile \
            --config=p/kubernetes \
            --metrics=off \
            --sarif --output=semgrep.sarif \
            --error
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifest-check:
    name: CloudFormation template policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test Auckland business-hours policy and shutdown ordering
        run: python3 -m unittest discover -s scripts/tests -p 'test*.py' -v

      - name: Validate business-hours CloudFormation and deployment IAM
        run: |
          python3 -m pip install --user cfn-lint==1.55.1
          cfn-lint deploy/aws/business-hours.yaml deploy/aws/github-oidc.yaml deploy/aws/app.yaml

      # These encode deployment invariants that a template edit must not undo.
      # Ported from the K3s manifest gates when K3s was retired (2026-09-10).
      - name: No host bind mounts
        run: |
          # Fargate has no hostPath, but a Volume with SourcePath is the same
          # host-filesystem exposure on EC2 launch type.
          if grep -nE '^\s*SourcePath:' deploy/aws/*.yaml; then
            echo "::error::host bind mounts reintroduce host filesystem exposure — not permitted"
            exit 1
          fi
          echo "OK: no host bind mounts"

      - name: No :latest image tags
        run: |
          # The ADOT collector is a vendor-published sidecar still on :latest.
          # TODO: pin it to a digest, then delete this exemption.
          if grep -nE '^\s*Image:.*:latest' deploy/aws/*.yaml \
               | grep -v 'aws-observability/aws-otel-collector'; then
            echo "::error::images must be pinned to an immutable tag, never :latest"
            exit 1
          fi
          echo "OK: no :latest tags (ADOT sidecar exempted)"

      - name: No hardcoded secrets in templates
        run: |
          if grep -nE '^\s*(Value|Default|SecretString):\s*["'"'"']?(sk-|AKIA|postgres(ql)?://[^ ]*:[^ ]*@)' deploy/aws/*.yaml; then
            echo "::error::secret literal found in a template — use Secrets/ValueFrom with Secrets Manager"
            exit 1
          fi
          echo "OK: no secret literals"

      - name: Credentials are injected from Secrets Manager
        run: |
          # Every credential-shaped environment variable must arrive through
          # Secrets: ValueFrom, never as a plaintext Environment entry.
          if grep -nE '^\s*-\s*\{\s*Name:\s*[A-Z_]*(SECRET|PASSWORD|API_KEY)[A-Z_]*,\s*Value:' deploy/aws/*.yaml; then
            echo "::error::credential passed as a plaintext Environment value — move it to Secrets/ValueFrom"
            exit 1
          fi
          echo "OK: credentials come from Secrets Manager"

      - name: No --reload in production Dockerfiles
        run: |
          # Strip comments before matching, so documentation that mentions
          # --reload does not trip the check.
          if grep -vE '^\s*#' services/*/Dockerfile | grep -n -- '--reload'; then
            echo "::error::--reload in a production image lets running code change in place"
            exit 1
          fi
          echo "OK: no --reload in production images"
