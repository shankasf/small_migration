name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by deploy.yml so nothing ships without these checks passing.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow differs when this is called by deploy.yml, so the standalone
  # CI run and the deploy-invoked one land in separate groups. Sharing a group
  # made them cancel each other, which intermittently killed deploys.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  frontend:
    name: Frontend — typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  ai-service:
    name: AI service — security and behaviour tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Security regression tests
        run: python -m pytest tests/ -v

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }

      # Node dependencies are gated by Trivy reading package-lock.json rather
      # than by `npm audit`.
      #
      # npm falls back to the registry's legacy full-tree audit endpoint
      # whenever a dependency resolves outside the registry — services/backend
      # pins xlsx to the SheetJS CDN tarball, because the registry copy is
      # abandoned at 0.18.5 with an unfixed advisory. npm has now retired that
      # endpoint ("This endpoint is being retired. Use the bulk advisory
      # endpoint instead"), and it answers 400, so `npm audit` cannot gate this
      # repo at all. Trivy resolves the same lockfile against its own database,
      # so the gate no longer depends on a registry endpoint — and it is the
      # scanner already gating our images in deploy.yml.
      #
      # Both services scan clean, so the gate stays at HIGH rather than
      # critical. If this starts failing, fix the dependency — do not lower
      # the threshold back.
      - name: Trivy — backend dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: services/backend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy — frontend dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: services/frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: pip-audit — ai-service
        run: |
          pip install pip-audit
          pip-audit -r services/ai-service/requirements.txt

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep scan
        # Curated rulesets covering language security rules, OWASP Top Ten and
        # infrastructure files. --error fails the job on any finding.
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/typescript \
            --config=p/python \
            --config=p/dockerfile \
            --config=p/kubernetes \
            --metrics=off \
            --sarif --output=semgrep.sarif \
            --error
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manifest-check:
    name: Kubernetes manifest policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # These encode deployment invariants that a manifest edit must not undo.
      - name: No hostPath mounts
        run: |
          if grep -n 'hostPath' deploy/kubernetes/*.yaml; then
            echo "::error::hostPath mounts reintroduce host filesystem exposure — not permitted"
            exit 1
          fi
          echo "OK: no hostPath mounts"

      - name: No :latest image tags
        run: |
          if grep -nE 'image:.*:latest' deploy/kubernetes/*.yaml; then
            echo "::error::images must be pinned to an immutable tag, never :latest"
            exit 1
          fi
          echo "OK: no :latest tags"

      - name: No hardcoded secrets in manifests
        run: |
          if grep -nE '^\s*(value|password|token):\s*["'"'"']?(sk-|AKIA|postgres(ql)?://[^ ]*:[^ ]*@)' deploy/kubernetes/*.yaml; then
            echo "::error::secret literal found in a manifest — use secretKeyRef"
            exit 1
          fi
          echo "OK: no secret literals"

      - name: No --reload in production Dockerfiles
        run: |
          # Strip comments before matching, so documentation that mentions
          # --reload does not trip the check.
          if grep -vE '^\s*#' services/*/Dockerfile | grep -n -- '--reload'; then
            echo "::error::--reload in a production image lets running code change in place"
            exit 1
          fi
          echo "OK: no --reload in production images"
