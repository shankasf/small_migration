name: Cognito user admin

# One-off user administration for the circini-demo user pool, run through the
# same GitHub OIDC deploy role as the pipeline (no long-lived AWS keys).
# - list: dump every user with status, email verification, and groups
# - provision: idempotently create users (Cognito emails each a temporary
#   password) and assign their group; existing users are never re-invited
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        default: list
        type: choice
        options: [list, provision, check-db]
      users:
        description: 'provision only: comma-separated email:group pairs (groups: admin|analyst|auditor)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

jobs:
  cognito:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve user pool
        id: pool
        run: |
          set -euo pipefail
          POOL=$(aws cloudformation list-exports \
            --query "Exports[?Name=='circini-UserPoolId'].Value" --output text)
          [ -n "$POOL" ] && [ "$POOL" != "None" ] || { echo "::error::user pool export not found"; exit 1; }
          echo "id=$POOL" >> "$GITHUB_OUTPUT"

      - name: List users
        if: ${{ inputs.action == 'list' }}
        run: |
          set -euo pipefail
          POOL="${{ steps.pool.outputs.id }}"
          aws cognito-idp list-users --user-pool-id "$POOL" \
            --query 'Users[].{Email:Attributes[?Name==`email`]|[0].Value,Status:UserStatus,Enabled:Enabled,EmailVerified:Attributes[?Name==`email_verified`]|[0].Value,Created:UserCreateDate}' \
            --output table
          for U in $(aws cognito-idp list-users --user-pool-id "$POOL" \
              --query 'Users[].Username' --output text); do
            USERGROUPS=$(aws cognito-idp admin-list-groups-for-user --user-pool-id "$POOL" \
              --username "$U" --query 'Groups[].GroupName' --output text)
            EMAIL=$(aws cognito-idp admin-get-user --user-pool-id "$POOL" --username "$U" \
              --query 'UserAttributes[?Name==`email`]|[0].Value' --output text)
            echo "groups: $EMAIL -> ${USERGROUPS:-<none>}"
          done

      # Read-only look at the app's user mirror and recent denials in RDS,
      # via a one-off Fargate task (the runner has no VPC access to the DB).
      - name: Check app database
        if: ${{ inputs.action == 'check-db' }}
        run: |
          set -euo pipefail
          SUBNETS=$(aws cloudformation list-exports \
            --query "Exports[?Name=='circini-AppSubnets'].Value" --output text)
          SG=$(aws cloudformation list-exports \
            --query "Exports[?Name=='circini-SgApp'].Value" --output text)
          SCRIPT='const {PrismaClient}=require("@prisma/client");const p=new PrismaClient();(async()=>{const u=await p.user.findMany({select:{email:true,name:true,role:true,status:true,entraOid:true,createdAt:true,lastLoginAt:true}});console.log("APP_USERS "+JSON.stringify(u,null,1));const d=await p.auditEvent.findMany({where:{decision:{not:"allow"}},orderBy:{createdAt:"desc"},take:25,select:{createdAt:true,action:true,detail:true,userId:true}});console.log("RECENT_DENIALS "+JSON.stringify(d,null,1));await p.$disconnect();})().catch(e=>{console.error("QUERY_ERROR",e.message);process.exit(1);});'
          TASK=$(aws ecs run-task --cluster circini-demo --launch-type FARGATE \
            --task-definition circini-schema-sync \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides "$(jq -n --arg s "$SCRIPT" '{containerOverrides:[{name:"schema-sync",command:["node","-e",$s]}]}')" \
            --query 'tasks[0].taskArn' --output text)
          echo "one-off task: $TASK"
          aws ecs wait tasks-stopped --cluster circini-demo --tasks "$TASK"
          TID="${TASK##*/}"
          aws logs get-log-events --log-group-name /ecs/circini \
            --log-stream-name "schema-sync/schema-sync/$TID" \
            --query 'events[].message' --output text

      - name: Provision users
        if: ${{ inputs.action == 'provision' }}
        env:
          USERS: ${{ inputs.users }}
        run: |
          set -euo pipefail
          POOL="${{ steps.pool.outputs.id }}"
          [ -n "$USERS" ] || { echo "::error::users input required"; exit 1; }
          IFS=',' read -ra PAIRS <<< "$USERS"
          for PAIR in "${PAIRS[@]}"; do
            EMAIL="${PAIR%%:*}"; GROUP="${PAIR##*:}"
            case "$GROUP" in admin|analyst|auditor) ;; *) echo "::error::bad group '$GROUP' for $EMAIL"; exit 1;; esac
            if aws cognito-idp admin-get-user --user-pool-id "$POOL" --username "$EMAIL" >/dev/null 2>&1; then
              echo "exists:  $EMAIL (no invitation sent)"
            else
              aws cognito-idp admin-create-user --user-pool-id "$POOL" --username "$EMAIL" \
                --user-attributes Name=email,Value="$EMAIL" Name=email_verified,Value=true \
                --desired-delivery-mediums EMAIL >/dev/null
              echo "created: $EMAIL — temporary password emailed"
            fi
            aws cognito-idp admin-add-user-to-group --user-pool-id "$POOL" \
              --username "$EMAIL" --group-name "$GROUP"
            echo "group:   $EMAIL -> $GROUP"
          done
