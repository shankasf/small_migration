---
# NOTE: the migration-agent Namespace is created once, out of band (see
# deploy/kubernetes/bootstrap.sh). Keeping it out of this manifest lets the CD
# ServiceAccount be scoped to the namespace instead of needing cluster-level
# rights.
#
# ConfigMap and Secret are also managed out of band (see deploy.sh / README).
# They are never hardcoded here.
#
# Images are immutable and tagged per commit. ${IMAGE_TAG} is substituted by
# the CD workflow (envsubst) so the manifest and the running image can never
# drift apart. Nothing is mounted from the host — the source lives in the image.

---
# Outputs PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: outputs-pvc
  namespace: migration-agent
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# AI Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: migration-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Makes the mounted outputs PVC group-writable by the container user.
        fsGroup: 10001
      containers:
        - name: ai-service
          image: ghcr.io/shankasf/small_migration/ai-service:${IMAGE_TAG}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: PORT
              value: "8084"
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: migration-agent-config
                  key: OPENAI_MODEL
            - name: OUTPUT_DIR
              valueFrom:
                configMapKeyRef:
                  name: migration-agent-config
                  key: OUTPUT_DIR
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: migration-agent-secret
                  key: OPENAI_API_KEY
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: migration-agent-secret
                  key: INTERNAL_API_KEY
            - name: BACKEND_URL
              value: "http://backend:3001"
            - name: OTEL_SERVICE_NAME
              value: "circini-ai-service"
          volumeMounts:
            - name: outputs
              mountPath: /data/outputs
            # readOnlyRootFilesystem is on, so anything that needs scratch
            # space gets an explicit tmpfs rather than a writable image layer.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /ai/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ai/health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: outputs-pvc
        - name: tmp
          emptyDir: {}

---
# AI Service
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: migration-agent
spec:
  selector:
    app: ai-service
  ports:
    - port: 8084
      targetPort: 8084

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: migration-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # Schema sync runs once, before the app starts, so replicas cannot race
      # on it and a failed sync surfaces as a clear init failure rather than a
      # crash-looping app container.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: prisma-db-push
          image: ghcr.io/shankasf/small_migration/backend:${IMAGE_TAG}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "db", "push", "--skip-generate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: migration-agent-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: backend
          image: ghcr.io/shankasf/small_migration/backend:${IMAGE_TAG}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: migration-agent-config
                  key: PORT
            - name: AI_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: migration-agent-config
                  key: AI_SERVICE_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: migration-agent-config
                  key: CORS_ORIGIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: migration-agent-secret
                  key: DATABASE_URL
            - name: AUTH_MODE
              value: "local"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: migration-agent-secret
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: migration-agent-secret
                  key: INTERNAL_API_KEY
            - name: SEED_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: migration-agent-secret
                  key: SEED_ADMIN_EMAIL
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: migration-agent-secret
                  key: SEED_ADMIN_PASSWORD
            - name: OTEL_SERVICE_NAME
              value: "circini-backend"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: migration-agent
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001

---
# Frontend Deployment (nginx serving the built SPA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: migration-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: ghcr.io/shankasf/small_migration/frontend:${IMAGE_TAG}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}

---
# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: migration-agent
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173

---
# Traefik middleware (unchanged; referenced by the ingress)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix
  namespace: migration-agent
spec:
  stripPrefix:
    prefixes: []

---
# HorizontalPodAutoscaler for Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: migration-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# PodDisruptionBudget for Backend
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: migration-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
