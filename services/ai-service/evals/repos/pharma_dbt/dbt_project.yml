name: 'circini_dbt_test_repo'
version: '1.8.0'
config-version: 2

profile: 'circini_dbt_test_repo'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  circini_dbt_test_repo:
    +materialized: table
    +transient: false
    +on_schema_change: append_new_columns

    landing_raw:
      +database: dev_cortex_poc
      #maternity:
      #  +schema: maternity
      #mental_health:
      #  +schema: mental_health
      #mortality:
      #  +schema: mortality
      pharma:
        +schema: pharma

seeds:
  +quote_columns: false
  +enabled: true
  +full_refresh: true
  circini_dbt_test_repo:
    pharma:
      +database: dev_cortex_poc
      +schema: pharma

snapshots:
  circini_dbt_test_repo:
    +target_database: dev_cortex_poc
    +strategy: check
    +check_cols: all
    +unique_key: id
    +dbt_valid_to_current: "to_timestamp_tz('9999-12-31 00:00:00 +00:00')"
    #maternity:
    #  +schema: maternity
    #mental_health:
    #  +schema: mental_health
    #mortality:
    #  +schema: mortality
    ods_hist:
      pharma:
        +schema: pharma
