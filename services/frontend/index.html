<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon is an inline data: URI, not an externally hosted file: there
         is no network fetch to protect, so subresource integrity does not
         apply. Verified false positive, suppressed on this line only. -->
    <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23C7A559' stroke-width='1.5'/%3E%3Cpath d='M16 5v22M5 16h22' stroke='%23C7A559' stroke-width='1' opacity='0.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23C7A559'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0C10" />
    <title>Circini Migration Agent</title>
    <!-- Fonts are self-hosted (public/fonts). No third-party request is made
         from the browser: it keeps user IPs and referrers off Google's
         infrastructure, and Google Fonts cannot be subresource-integrity
         pinned because the CSS varies by user agent. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("circini_theme") === "light" ? "light" : "dark";
          var r = document.documentElement;
          r.classList.remove("light", "dark");
          r.classList.add(t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
